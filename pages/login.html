<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Glowbound</title>
    <link rel="icon" href="images/site/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/login.js"></script>
</head>
<body>
    <header>
        <a class="logo" href="index.html">
            <img src="images/site/logo.svg" alt="" width="32" height="32">
            Glowbound
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="game.html">Play</a>
            <a href="rankings.html">Rankings</a>
            <a href="register.html">Register</a>
            <a href="login.html" class="current">Log in</a>
        </nav>
        <div id="UserStatus" class="user-status"></div>
    </header>
        <main>
        <h1>Log in</h1>

        <div class="panel" id="LoginPanel">
            <label for="EmailInput">Email</label>
            <input type="email" id="EmailInput">

            <label for="PasswordInput">Password</label>
            <input type="password" id="PasswordInput">

            <button type="button" id="LoginButton" class="button">Log in</button>

            <div id="LoginFailure" class="feedback"></div>

            <p>No account yet? <a href="register.html">Register here</a>.</p>
        </div>
    </main>
        <footer>
        <p>Glowbound was made for CST2120 Web Applications and Databases.</p>
    </footer>
</body>
</html>
