<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Glowbound</title>
    <link rel="icon" href="images/site/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/login.js"></script>
</head>
<body>
    <header>
        <a class="logo" href="index.html">
            <img src="images/site/logo.svg" alt="" width="32" height="32">
            Glowbound
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="game.html">Play</a>
            <a href="rankings.html" class="current">Rankings</a>
            <a href="register.html">Register</a>
            <a href="login.html">Log in</a>
        </nav>
        <div id="UserStatus" class="user-status"></div>
    </header>
    <main>
        <h1>Rankings</h1>
        <p>Every player's best score, highest first, is displayed here.</p>
        <table class="rankings">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Lantern Colour</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="RankingsBody">
                <!-- Rankings will be populated here -->
            </tbody>
        </table>

        <p id="NoScores" class="note">No scores available.</p>
        </main>
        <footer>
            <p>Glowbound was made for CST2120 Web Applications and Databases.</p>
        </footer> 
    </body>
</html>
